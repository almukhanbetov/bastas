server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Этот контейнер всегда за TLS-терминирующим reverse-proxy'ем и сам
    # слушает только plain HTTP (см. docker-compose.prod.yml: 127.0.0.1:3000:80),
    # поэтому $scheme здесь всегда "http" — автоматический редирект nginx
    # на завершающий слэш (try_files ... $uri/) иначе строит Location с
    # неверной схемой (http вместо https), даже если клиент пришёл по HTTPS.
    # absolute_redirect off делает такие редиректы относительными — клиент
    # сам резолвит их на исходной схеме, downgrade невозможен.
    absolute_redirect off;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
}
