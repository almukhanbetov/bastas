services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bastas
      POSTGRES_PASSWORD: bastas
      POSTGRES_DB: bastas
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bastas"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://bastas:bastas@postgres:5432/bastas?sslmode=disable
    ports:
      - "127.0.0.1:8080:8080"

  frontend:
    build:
      context: ./frontend
      # статический экспорт — NEXT_PUBLIC_API_URL зашивается в бандл при сборке,
      # переменная окружения контейнера в рантайме ни на что не влияет (см. Dockerfile).
      args:
        NEXT_PUBLIC_API_URL: ""
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:80"

volumes:
  pgdata: